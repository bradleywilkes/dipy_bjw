name: Visualization

on:
  # Sandbox fork: trigger manually via the Actions tab.
  # Re-add `push` / `pull_request` triggers if you want auto-CI again.
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  VIZ:
    uses: ./.github/workflows/test_template.yml
    with:
      runs-on: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      extra-depends: scikit_learn vtk fury scipy
      enable-viz-tests: true
